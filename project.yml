# XcodeGen spec — the single source of truth for the Xcode project.
# Run `xcodegen` after adding or removing files, then open ImageStudio.xcodeproj.
name: ImageStudio

options:
  bundleIdPrefix: com.eyeb0l
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: 359794K46A
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  ImageStudio:
    type: application
    platform: iOS
    sources:
      - path: ImageStudio
      - path: Shared
    dependencies:
      - target: ImageStudioWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eyeb0l.ImageStudio
        PRODUCT_NAME: ImageStudio
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Image Studio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Image Studio saves the images you export to your photo library.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Live Activity UI for background generations. The app starts and updates the activity.
  ImageStudioWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ImageStudioWidgets
      - path: Shared
    info:
      path: ImageStudioWidgets/Info.plist
      properties:
        CFBundleDisplayName: Image Studio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eyeb0l.ImageStudio.Widgets
        PRODUCT_NAME: ImageStudioWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  ImageStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ImageStudioTests
    dependencies:
      - target: ImageStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eyeb0l.ImageStudioTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ImageStudio:
    build:
      targets:
        ImageStudio: all
        ImageStudioTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-SeedSampleLibrary": false
    test:
      config: Debug
      gather_coverage_for: [ImageStudio]
      targets:
        - ImageStudioTests
    archive:
      config: Release
